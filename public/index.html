<title>Pixi AR</title><style>

</style></head><body><video id=v playsinline muted autoplay></video><canvas id=c></canvas><div id=ui></div><div id=tw></div>
<script>
const $=id=>document.getElementById(id),TAU=Math.PI*2,D=Math.PI/180,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a),wrap=a=>((a%360)+540)%360-180,dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
let P=null,W,H,ori={a:0,b:90,g:0,ok:false},prev=null,lastVis=0,lastT=0,AC=null,lastO=[0,0,0],started=false,saveT=0,hudT=0;
try{P=JSON.parse(localStorage.getItem('pixi'))}catch(e){}
const save=()=>{try{P.last=Date.now();localStorage.setItem('pixi',JSON.stringify(P))}catch(e){}};
const mk=n=>({name:n,stage:'egg',age:0,hun:45,hap:75,ene:85,hyg:90,hea:100,aff:60,sick:false,poops:[],hatch:0,last:Date.now()});
const E={az:0,tgt:0,d:2.2,face:1,busy:'',bt:0,sleep:false,dark:0,pet:0,petT:0,parts:[],look:[0,0],zones:[],dw:{},walk:0,nextW:6,poopT:0,sickT:30,hand:null,camAz:0,food:'🍎',px:0,py:0,u:100,zT:0,st:''};
const C=$('c'),X=C.getContext('2d');
function size(){const r=devicePixelRatio||1;W=innerWidth;H=innerHeight;C.width=W*r;C.height=H*r;X.setTransform(r,0,0,r,0,0)}addEventListener('resize',size);size();
// ---- Audio
function beep(f,d=.09){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.setValueAtTime(.06,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}
const chirp=()=>{beep(rnd(700,900));setTimeout(()=>beep(rnd(950,1250)),90)};
// ---- Sensores y proyección AR (la mascota está anclada al suelo del mundo)
addEventListener('ondeviceorientationabsolute' in window?'deviceorientationabsolute':'deviceorientation',e=>{if(e.alpha==null)return;const h=e.webkitCompassHeading,a=h!=null?360-h:e.alpha;ori.a=ori.ok?ori.a+wrap(a-ori.a)*.3:a;ori.b=e.beta;ori.g=e.gamma;ori.ok=true},true);
function bas(){const a=ori.a*D,b=ori.b*D,g=ori.g*D,ca=Math.cos(a),sa=Math.sin(a),cb=Math.cos(b),sb=Math.sin(b),cg=Math.cos(g),sg=Math.sin(g);
 return{r:[ca*cg-sa*sb*sg,sa*cg+ca*sb*sg,-cb*sg],u:[-sa*cb,ca*cb,sb],f:[-(ca*sg+sa*sb*cg),-(sa*sg-ca*sb*cg),-cb*cg]}}
function wp(az,d,h,B){const s=H*.85;if(!ori.ok)return{x:W/2+wrap(az-E.camAz)*W/48,y:H*.74-h*s/d,s:s/d};
 const v=[d*Math.sin(az*D),d*Math.cos(az*D),h-1.4],z=dot(v,B.f);if(z<.2)return null;return{x:W/2+s*dot(v,B.r)/z,y:H/2-s*dot(v,B.u)/z,s:s/z}}
// ---- Visión: la cámara detecta tu mano (movimiento) y la oscuridad
const FC=document.createElement('canvas'),FX=FC.getContext('2d',{willReadFrequently:true}),FW=80;
function grab(){const v=$('v');if(!v.videoWidth)return null;const w=FW,h=Math.round(FW*v.videoHeight/v.videoWidth);FC.width=w;FC.height=h;FX.drawImage(v,0,0,w,h);
 const d=FX.getImageData(0,0,w,h).data,g=new Float32Array(w*h);for(let i=0;i<w*h;i++)g[i]=d[i*4]*.3+d[i*4+1]*.59+d[i*4+2]*.11;return{g,w,h}}
function vm(){const v=$('v'),vw=v.videoWidth||1,vh=v.videoHeight||1,sc=Math.max(W/vw,H/vh);return{sc,vw,vh,ox:(vw*sc-W)/2,oy:(vh*sc-H)/2}}
const f2s=(fx,fy)=>{const m=vm();return[fx*m.vw*m.sc-m.ox,fy*m.vh*m.sc-m.oy]},s2f=(x,y)=>{const m=vm();return[(x+m.ox)/(m.vw*m.sc),(y+m.oy)/(m.vh*m.sc)]};
function vision(){const f=grab();if(!f)return;const dt=.08;let lum=0,c=0;for(let i=0;i<f.g.length;i+=7){lum+=f.g[i];c++}lum/=c;
 E.dark=lum<30?Math.min(3,E.dark+dt):Math.max(0,E.dark-dt*2);
 const da=Math.abs(wrap(ori.a-lastO[0]))+Math.abs(ori.b-lastO[1])+Math.abs(ori.g-lastO[2]);lastO=[ori.a,ori.b,ori.g];
 const p=prev;prev=f;E.hot=false;E.hand=null;if(!p||p.w!==f.w||p.h!==f.h||E.dark>.5||(ori.ok&&da>3.5))return;
 let tot=0;for(let i=0;i<f.g.length;i+=3)if(Math.abs(f.g[i]-p.g[i])>22)tot++;if(tot>f.g.length/3*.28)return;
 const m=vm();
 for(const z of E.zones){const[fx,fy]=s2f(z.x,z.y),r=z.r/(m.vw*m.sc)*f.w,cx=fx*f.w,cy=fy*f.h;let n=0,sx=0,sy=0;
  for(let y=Math.max(0,cy-r|0);y<Math.min(f.h,cy+r);y++)for(let x=Math.max(0,cx-r|0);x<Math.min(f.w,cx+r);x++)if((x-cx)**2+(y-cy)**2<r*r){const i=y*f.w+x;if(Math.abs(f.g[i]-p.g[i])>22){n++;sx+=x;sy+=y}}
  const hot=n>Math.PI*r*r*.1;E.dw[z.id]=clamp((E.dw[z.id]||0)+(hot?dt:-dt*1.5),0,1.2);
  if(hot){const[hx,hy]=f2s(sx/n/f.w,sy/n/f.h);E.hand=[hx,hy]}
  if(z.k==='pet')petting(hot,dt);else if(z.k==='egg'){if(hot)P.hatch+=dt}else if(E.dw[z.id]>.6){E.dw[z.id]=0;act(z)}}}
// ---- Acciones (todas por gestos delante de la cámara)
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;$('tw').appendChild(d);setTimeout(()=>d.remove(),2300)}
function part(t,x,y,vx,vy,l=1.2,sz=.22){E.parts.push({t,x,y,vx,vy,l,sz})}
function burst(t,n=8){for(let i=0;i<n;i++)part(t,E.px,E.py-E.u*.35,rnd(-90,90),-rnd(30,130),1.3,.16)}
function petting(h,dt){E.hot=h;if(!h||P.stage==='egg'||E.sleep)return;P.aff=clamp(P.aff+6*dt,0,100);P.hap=clamp(P.hap+5*dt,0,100);E.pet=1;E.petT+=dt;
 if(E.petT>.5){E.petT=0;part('❤️',E.px+rnd(-.2,.2)*E.u,E.py-E.u*.7,rnd(-10,10),-60);chirp();navigator.vibrate&&navigator.vibrate(15)}}
function act(z){if(E.busy||E.sleep)return;navigator.vibrate&&navigator.vibrate(30);
 if(z.k==='food'){E.busy='eat';E.bt=2;P.hun=clamp(P.hun+28,0,100);P.hap=clamp(P.hap+3,0,100);E.food=['🍎','🍖','🍪','🥕'][Math.random()*4|0];part(z.ref.e,z.x,z.y,(E.px-z.x)*1.6,(E.py-E.u*.3-z.y)*1.6,.6,.3);E.poopT=E.poopT||rnd(70,200);chirp()}
 else if(z.k==='ball'){E.busy='play';E.bt=3.5;P.hap=clamp(P.hap+18,0,100);P.ene=clamp(P.ene-8,0,100);P.hun=clamp(P.hun-4,0,100);burst('✨',6);chirp()}
 else if(z.k==='pill'){P.sick=false;P.hea=clamp(P.hea+25,0,100);burst('💚',8);toast('¡Se ha curado!');chirp()}
 else if(z.k==='poop'){P.poops.splice(z.ref.i,1);P.hyg=clamp(P.hyg+18,0,100);part('✨',z.x,z.y,0,-40,1,.3);part('🫧',z.x+10,z.y,10,-50,1,.2);beep(500)}}
function hatch(){P.stage='baby';P.age=0;E.busy='';burst('🎉',14);toast('¡'+P.name+' ha nacido!');chirp();save()}
function tick(dt,live){if(P.stage==='egg')return;const s=dt/60,sl=E.sleep&&live,v=[P.hun,P.hap,P.ene,P.hyg];
 P.hun=clamp(P.hun-(sl?.3:1)*s,0,100);P.hap=clamp(P.hap-.6*(P.sick?2:1)*s,0,100);P.ene=clamp(P.ene+(sl?6:-.35)*s,0,100);P.aff=clamp(P.aff-.2*s,0,100);P.hyg=clamp(P.hyg-(.05+.25*P.poops.length)*s,0,100);
 const low=v.filter(x=>x<15).length;P.hea=clamp(P.hea+(low?-.6*low:v.every(x=>x>40)?.3:0)*s-(P.sick?.8*s:0),5,100);P.age+=s;
 if(live){E.sickT-=dt;if(E.sickT<=0){E.sickT=30;if(!P.sick&&(P.hyg<30||P.hun<10)&&Math.random()<.2){P.sick=true;toast('🤒 ¡Está malito!')}}}}
function offline(){const m=clamp((Date.now()-P.last)/60000,0,480);if(m<1||P.stage==='egg')return;tick(m*21,false);if(m>60&&P.poops.length<2)P.poops.push({az:rnd(-60,60),d:rnd(1.6,2.6)})}
// ---- Lógica
function props(){const a=[];if(P.stage==='egg'||E.sleep)return a;
 if(!E.busy){if(P.hun<60)a.push({k:'food',e:E.food,az:E.az+17,d:E.d-.1});if(P.hap<85&&P.ene>25&&P.hun>25)a.push({k:'ball',e:'🎾',az:E.az-19,d:E.d-.1});if(P.sick)a.push({k:'pill',e:'💊',az:E.az+32,d:E.d})}
 P.poops.forEach((p,i)=>a.push({k:'poop',e:'💩',az:p.az,d:p.d,i}));return a}
const need=()=>P.sick?'🤒':P.hun<55?'🍖':P.poops.length?'💩':P.ene<30?'🥱':P.hap<80?'🎾':P.aff<60?'🥺':'';
function hint(){if(P.stage==='egg')return'🥚 Pasa la mano sobre el huevo para que eclosione';if(E.sleep)return'💤 Shhh… duerme. Destapa la cámara para despertarle';
 return P.sick?'🤒 Está malito: pasa la mano sobre la 💊':P.hun<55?'🍖 Tiene hambre: pasa la mano sobre la comida':P.poops.length?'💩 Limpia la caca pasando la mano':P.ene<30?'🥱 Tiene sueño: tapa la cámara con la mano':P.hap<80?'🎾 Quiere jugar: pasa la mano sobre la pelota':'🤗 Acarícialo pasando la mano sobre él'}
function update(dt,t){const was=E.sleep;E.sleep=E.dark>1.2&&P.stage!=='egg';
 if(was&&!E.sleep){chirp();if(P.ene<40)P.hap=clamp(P.hap-5,0,100)}
 if(P.stage==='egg'&&P.hatch>3)hatch();
 tick(dt,true);E.pet=Math.max(0,E.pet-dt*1.5);if(E.bt>0){E.bt-=dt;if(E.bt<=0)E.busy=''}
 if(E.poopT>0&&!E.sleep&&(E.poopT-=dt)<=0){E.poopT=0;P.poops.push({az:E.az+rnd(-8,8),d:E.d+.2});P.hyg=clamp(P.hyg-4,0,100);E.busy='poop';E.bt=1}
 if(P.stage!=='egg'&&!E.sleep){const o=Math.abs(wrap(E.az-E.camAz));if(o>34&&!E.busy)E.tgt=E.camAz+rnd(-14,14);if((E.nextW-=dt)<=0){E.nextW=rnd(6,14);if(o<30)E.tgt=E.camAz+rnd(-22,22)}
  if(E.busy==='play')E.tgt=E.az-(Math.sin(t/500)>0?.5:-.5)}
 const dA=wrap(E.tgt-E.az);if(Math.abs(dA)>1.5&&!E.sleep&&P.stage!=='egg'){E.az+=Math.sign(dA)*Math.min(Math.abs(dA),(20+Math.abs(dA)*1.2)*dt);E.walk=1;E.face=Math.sign(dA)}else E.walk=0;
 const lk=E.hand?[clamp((E.hand[0]-E.px)/200,-1,1),clamp((E.hand[1]-E.py+E.u*.3)/200,-1,1)]:[0,0];E.look=[E.look[0]+(lk[0]-E.look[0])*.2,E.look[1]+(lk[1]-E.look[1])*.2];
 if(E.sleep&&(E.zT-=dt)<=0){E.zT=1.3;part('💤',E.px+E.u*.2,E.py-E.u*.7,8,-30,2,.2)}
 const st=P.stage==='egg'?'egg':P.age<20?'baby':P.age<120?'young':'adult';if(st!==P.stage&&P.stage!=='egg'){P.stage=st;toast('✨ ¡'+P.name+' ha crecido!');burst('⭐',12);chirp()}
 if((saveT+=dt)>5){saveT=0;save()}
 if((hudT+=dt)>.4){hudT=0;hud()}}
function hud(){if(!$('nm'))return;const L={egg:'Huevo',baby:'Cría',young:'Joven',adult:'Adulto'}[P.stage];$('nm').textContent=P.name+' · '+L+(P.sick?' 🤒':'');
 [P.hun,P.hap,P.ene,P.hyg].forEach((v,i)=>{const b=$('b'+i);b.style.width=v+'%';b.style.background=v<30?'#f43f5e':''});$('hn').textContent=hint();$('hh').textContent=Math.round(P.hea)}
// ---- Dibujo
function drawPet(t,x,y,u){const sl=E.sleep,ex=sl?'z':E.busy==='eat'?'eat':E.pet>.2?'happy':(P.sick||(P.hun+P.hap+P.ene+P.hyg)/4<35)?'sad':'n',
 walk=E.walk&&!sl,hop=walk?Math.abs(Math.sin(t/120))*.08*u:E.busy==='play'?Math.abs(Math.sin(t/150))*.14*u:0,
 sq=E.pet>.2?.05*Math.sin(t/90):.02*Math.sin(t/500),col={baby:['#a5f3fc','#38bdf8'],young:['#ddd6fe','#8b5cf6'],adult:['#fecdd3','#fb7185']}[P.stage];
 if(sl){const g=X.createRadialGradient(x,y-.3*u,0,x,y-.3*u,u);g.addColorStop(0,'#c7d2fe55');g.addColorStop(1,'#0000');X.fillStyle=g;X.fillRect(x-u,y-1.3*u,2*u,2*u)}
 X.fillStyle='#0006';X.beginPath();X.ellipse(x,y,.36*u*(1-hop/u*2),.075*u,0,0,TAU);X.fill();
 X.save();X.translate(x,y-hop);X.scale(E.face*(1+sq),1-sq);X.lineCap='round';
 X.strokeStyle=col[1];X.lineWidth=.07*u;X.beginPath();X.moveTo(.28*u,-.18*u);X.quadraticCurveTo(.5*u,-.22*u+Math.sin(t/160)*.06*u,.44*u,-.4*u);X.stroke();
 X.fillStyle=col[1];for(const s of[-1,1]){X.beginPath();X.moveTo(s*.1*u,-.55*u);X.quadraticCurveTo(s*.3*u,-.88*u+Math.sin(t/300+s)*.02*u,s*.31*u,-.5*u);X.fill();
  const l=walk?Math.max(0,Math.sin(t/120+s*1.6))*.04*u:0;X.beginPath();X.ellipse(s*.14*u,-.03*u-l,.09*u,.055*u,0,0,TAU);X.fill()}
 const g=X.createLinearGradient(0,-.6*u,0,0);g.addColorStop(0,col[0]);g.addColorStop(1,col[1]);X.fillStyle=g;X.beginPath();X.ellipse(0,-.3*u,.34*u,.3*u,0,0,TAU);X.fill();
 X.fillStyle='#fff6';X.beginPath();X.ellipse(0,-.22*u,.2*u,.17*u,0,0,TAU);X.fill();
 if(P.sick){X.fillStyle='#84cc1655';X.beginPath();X.ellipse(0,-.3*u,.34*u,.3*u,0,0,TAU);X.fill()}
 X.fillStyle='#fb7185';X.globalAlpha=clamp(P.aff/120,.15,.7);for(const s of[-1,1]){X.beginPath();X.ellipse(s*.22*u,-.27*u,.05*u,.03*u,0,0,TAU);X.fill()}X.globalAlpha=1;
 const lx=E.look[0]*.025*u,ly=E.look[1]*.02*u;X.strokeStyle='#1e293b';X.lineWidth=.025*u;
 for(const s of[-1,1]){const e0=s*.12*u,ey=-.37*u;
  if(ex==='z'||(ex==='n'&&Math.sin(t/1700)>.985)){X.beginPath();X.arc(e0,ey,.04*u,0,Math.PI);X.stroke()}
  else if(ex==='happy'){X.beginPath();X.arc(e0,ey+.02*u,.04*u,Math.PI,0);X.stroke()}
  else{X.fillStyle='#fff';X.beginPath();X.ellipse(e0,ey,.055*u,ex==='sad'?.05*u:.06*u,0,0,TAU);X.fill();X.fillStyle='#1e293b';X.beginPath();X.arc(e0+lx,ey+ly,.03*u,0,TAU);X.fill();X.fillStyle='#fff';X.beginPath();X.arc(e0+lx+.01*u,ey+ly-.01*u,.01*u,0,TAU);X.fill()}}
 X.beginPath();X.fillStyle='#1e293b';
 if(ex==='eat'){X.fillStyle='#7f1d1d';X.ellipse(0,-.25*u,.045*u,.025*u+.03*u*Math.abs(Math.sin(t/110)),0,0,TAU);X.fill()}
 else if(ex==='happy'){X.arc(0,-.285*u,.06*u,.1,Math.PI-.1);X.stroke()}
 else if(ex==='sad'){X.arc(0,-.22*u,.04*u,Math.PI+.3,-.3);X.stroke()}
 else if(ex==='z'){X.ellipse(0,-.25*u,.015*u,.012*u,0,0,TAU);X.fill()}
 else{X.arc(0,-.28*u,.035*u,.2,Math.PI-.2);X.stroke()}
 X.restore()}
function drawEgg(t,x,y,u){const k=P.hatch/3;X.fillStyle='#0006';X.beginPath();X.ellipse(x,y,.28*u,.065*u,0,0,TAU);X.fill();
 X.save();X.translate(x,y);X.rotate(Math.sin(t/180)*(.03+k*.12));const g=X.createLinearGradient(-.2*u,-.6*u,.2*u,0);g.addColorStop(0,'#fff7ed');g.addColorStop(1,'#fdba74');X.fillStyle=g;X.beginPath();X.ellipse(0,-.3*u,.22*u,.3*u,0,0,TAU);X.fill();
 X.fillStyle='#fb923c88';[[-.08,-.4,.04],[.09,-.25,.05],[-.05,-.15,.03]].forEach(([a,b,r])=>{X.beginPath();X.arc(a*u,b*u,r*u,0,TAU);X.fill()});
 if(k>.2){X.strokeStyle='#7c2d12';X.lineWidth=.02*u;X.beginPath();X.moveTo(-.12*u,-.45*u);X.lineTo(-.04*u,-.38*u);X.lineTo(-.1*u,-.3*u);if(k>.6){X.lineTo(.0,-.25*u);X.lineTo(.1*u,-.34*u)}X.stroke()}X.restore()}
function draw(t,dt,B){E.zones=[];const L=[];
 for(const p of props()){const q=wp(p.az,p.d,0,B);if(q)L.push({d:p.d,f:()=>{const s=q.s,id=p.k+(p.i??''),w=E.dw[id]||0,sz=.3*s;X.fillStyle='#0005';X.beginPath();X.ellipse(q.x,q.y,.12*s,.03*s,0,0,TAU);X.fill();
